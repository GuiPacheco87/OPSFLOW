services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: opsflow, POSTGRES_USER: opsflow, POSTGRES_PASSWORD: opsflow}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U opsflow], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: [./backend:/app]
  worker:
    build: ./backend
    env_file: .env
    depends_on: [backend, redis]
    command: celery -A app.worker.celery worker --loglevel=info
    volumes: [./backend:/app]
  frontend:
    build: ./frontend
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [backend]
    volumes: [./frontend:/app, /app/node_modules]
volumes: {postgres_data: {}}
