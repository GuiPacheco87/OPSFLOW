[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="opsflow-api"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","pydantic-settings>=2.5,<3","PyJWT>=2.9,<3","pwdlib[argon2]>=0.2,<1","email-validator>=2.2,<3","celery[redis]>=5.4,<6"]
[project.optional-dependencies]
dev=["pytest>=8,<9","httpx>=0.27,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=120
[tool.ruff.lint]
select=["F"]
